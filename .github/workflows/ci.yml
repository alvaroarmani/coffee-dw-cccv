name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extractor and loader tests
        run: |
          python -m pytest tests/extractors tests/loaders

  dbt-tests:
    name: dbt tests
    runs-on: ubuntu-latest
    needs: python-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coffee_dw
          POSTGRES_USER: coffee_user
          POSTGRES_PASSWORD: coffee_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coffee_user -d coffee_dw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_TARGET: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create schemas
        run: |
          psql postgresql://coffee_user:coffee_password@localhost:5432/coffee_dw -f docker/postgres/init/01_create_schemas.sql

      - name: Create bronze table
        run: |
          psql postgresql://coffee_user:coffee_password@localhost:5432/coffee_dw -f docker/postgres/init/02_create_bronze_tables.sql

      - name: Insert sample bronze data
        run: |
          psql postgresql://coffee_user:coffee_password@localhost:5432/coffee_dw <<'SQL'
          INSERT INTO bronze.raw_cccv_daily_prices (
              price_date,
              coffee_type,
              coffee_description,
              harvest_year,
              price_brl,
              source_url,
              extracted_at
          )
          VALUES
              ('2026-05-04', 'arabica_dura', 'Arábica bebida "dura", bica corrida', '2025/2026', 1643.00, 'https://www.cccv.org.br/cotacao/', CURRENT_TIMESTAMP),
              ('2026-05-04', 'arabica_rio', 'Arábica bebida "rio", bica corrida', '2025/2026', 1130.00, 'https://www.cccv.org.br/cotacao/', CURRENT_TIMESTAMP),
              ('2026-05-04', 'conilon', 'Conilon bica corrida, tipo 7/8', '2025/2026', 873.00, 'https://www.cccv.org.br/cotacao/', CURRENT_TIMESTAMP),
              ('2026-05-20', 'arabica_dura', 'Arábica bebida "dura", bica corrida', '2026/2027', 1500.00, 'https://www.cccv.org.br/cotacao/', CURRENT_TIMESTAMP),
              ('2026-05-20', 'arabica_rio', 'Arábica bebida "rio", bica corrida', '2026/2027', 1050.00, 'https://www.cccv.org.br/cotacao/', CURRENT_TIMESTAMP),
              ('2026-05-20', 'conilon', 'Conilon bica corrida, tipo 7/8', '2026/2027', 830.00, 'https://www.cccv.org.br/cotacao/', CURRENT_TIMESTAMP);
          SQL

      - name: Run dbt debug
        run: |
          dbt debug --project-dir dbt/coffee_dw --profiles-dir dbt/coffee_dw --target ci

      - name: Run dbt run
        run: |
          dbt run --project-dir dbt/coffee_dw --profiles-dir dbt/coffee_dw --target ci

      - name: Run dbt test
        run: |
          dbt test --project-dir dbt/coffee_dw --profiles-dir dbt/coffee_dw --target ci
