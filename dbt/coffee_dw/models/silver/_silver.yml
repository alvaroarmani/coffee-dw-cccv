version: 2

models:
  - name: stg_cccv_coffee_prices
    description: "Modelo Silver com cotações de café da CCCV padronizadas por tipo de café e safra."
    columns:
      - name: raw_price_id
        description: "Identificador do registro original na tabela Bronze."
        tests:
          - not_null
          - unique

      - name: price_date
        description: "Data da cotação."
        tests:
          - not_null

      - name: coffee_type
        description: "Tipo de café."
        tests:
          - not_null
          - accepted_values:
              values:
                - arabica_dura
                - arabica_rio
                - conilon

      - name: coffee_description
        description: "Descrição comercial do café cotado."
        tests:
          - not_null

      - name: harvest_year
        description: "Safra da cotação."
        tests:
          - not_null

      - name: price_brl
        description: "Preço em reais."
        tests:
          - not_null
